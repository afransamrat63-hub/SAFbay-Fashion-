
<script>
const products = [
  {
    id: 1,
    name: "Classic Black T-Shirt",
    price: 499,
    img: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"
  },
  {
    id: 2,
    name: "Premium White Shirt",
    price: 899,
    img: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=600&q=80"
  },
  {
    id: 3,
    name: "Streetwear Style",
    price: 799,
    img: "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"
  },
  {
    id: 4,
    name: "Luxury Fashion",
    price: 1299,
    img: "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=600&q=80"
  }
];

const cart = {};

function showProducts() {
  const container = document.getElementById("products");

  if (!container) return;

  container.innerHTML = products.map(function(p) {
    return `
      <div class="product">
        <img src="${p.img}" alt="${p.name}"
             style="width:100%;height:200px;object-fit:cover">
        <div class="info">
          <h3>${p.name}</h3>
          <p class="price">₹${p.price}</p>
          <button class="btn" onclick="addToCart(${p.id})">
            ADD TO CART
          </button>
        </div>
      </div>
    `;
  }).join("");
}

function addToCart(id) {
  cart[id] = (cart[id] || 0) + 1;
  showCart();
}

function changeQty(id, amount) {
  cart[id] = (cart[id] || 0) + amount;
  if (cart[id] <= 0) delete cart[id];
  showCart();
}

function showCart() {
  const selected = products.filter(p => cart[p.id]);

  document.getElementById("count").textContent =
    selected.reduce((sum, p) => sum + cart[p.id], 0);

  document.getElementById("cartItems").innerHTML =
    selected.length
      ? selected.map(p => `
          <div class="cartrow">
            <span>${p.name}<br>₹${p.price} × ${cart[p.id]}</span>
            <span>
              <button onclick="changeQty(${p.id},-1)">−</button>
              <button onclick="changeQty(${p.id},1)">+</button>
            </span>
          </div>
        `).join("")
      : "Your cart is empty.";

  document.getElementById("total").textContent =
    selected.reduce((sum, p) => sum + p.price * cart[p.id], 0);
}

showProducts();
showCart();
</script>
