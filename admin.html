
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAFbay Fashion Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{font-family:Arial,sans-serif;max-width:650px;margin:25px auto;padding:16px;background:#f5f5f5;color:#222}
    h1{text-align:center}
    .panel{background:white;padding:18px;border-radius:12px;margin:15px 0}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:7px;border:1px solid #ccc}
    button{background:#111;color:white;cursor:pointer}
    .product{background:white;padding:12px;margin:12px 0;border-radius:10px}
    .product img{width:100%;max-height:260px;object-fit:contain}
    .actions{display:flex;gap:8px}
    .actions button{flex:1}
    #app{display:none}
    #status{overflow-wrap:anywhere}
  </style>
</head>
<body>
  <h1>SAFbay Fashion</h1>
  <h2 style="text-align:center">Admin Panel</h2>
  <p id="status">Configure your Supabase project first.</p>

  <section class="panel" id="login">
    <h3>Admin Login</h3>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
  </section>

  <main id="app">
    <button id="logoutBtn">Logout</button>
    <section class="panel">
      <h3 id="formTitle">Add Product</h3>
      <form id="productForm">
        <input id="name" placeholder="Product name" required>
        <input id="price" type="number" min="0" step="0.01" placeholder="Price in taka" required>
        <label>Product photo</label>
        <input id="photo" type="file" accept="image/*">
        <button id="saveBtn" type="submit">Save Product</button>
        <button id="cancelBtn" type="button" style="display:none">Cancel Edit</button>
      </form>
    </section>
    <h3>Products</h3>
    <div id="products"></div>
  </main>

<script>
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_OR_ANON_KEY";

const statusBox = document.getElementById("status");
let db = null;
let editingId = null;
let currentImage = "";

if (!SUPABASE_URL.startsWith("https://") ||
    SUPABASE_KEY.startsWith("PASTE_")) {
  statusBox.textContent =
    "Setup needed: add your Supabase Project URL and public key in this file.";
} else {
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  statusBox.textContent = "Please log in with your admin account.";
}

function message(text) {
  statusBox.textContent = text;
}

async function checkAdmin() {
  const {data:{user},error:userError} = await db.auth.getUser();
  if (userError || !user) {
    document.getElementById("login").style.display = "block";
    document.getElementById("app").style.display = "none";
    return false;
  }

  const {data,error} = await db.rpc("is_admin");
  if (error || data !== true) {
    message("Admin permission check failed. Check your admins table and SQL policies.");
    await db.auth.signOut();
    return false;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  message("Admin login successful.");
  await loadProducts();
  return true;
}

document.getElementById("loginBtn").onclick = async () => {
  if (!db) return message("Add Supabase URL and public key first.");
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const {error} = await db.auth.signInWithPassword({email,password});
  if (error) return message("Login failed: " + error.message);
  await checkAdmin();
};

document.getElementById("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

async function loadProducts() {
  const container = document.getElementById("products");
  container.textContent = "Loading products...";
  const {data,error} = await db.from("products")
    .select("id,name,price,image_url")
    .order("created_at",{ascending:false});

  if (error) {
    container.textContent = "Could not load products: " + error.message;
    return;
  }
  container.replaceChildren();

  data.forEach(p => {
    const card = document.createElement("article");
    card.className = "product";
    const img = document.createElement("img");
    img.src = p.image_url;
    img.alt = p.name;
    const title = document.createElement("h3");
    title.textContent = p.name;
    const price = document.createElement("p");
    price.textContent = "৳" + p.price;
    const actions = document.createElement("div");
    actions.className = "actions";
    const edit = document.createElement("button");
    edit.textContent = "Edit";
    edit.onclick = () => {
      editingId = p.id;
      currentImage = p.image_url;
      document.getElementById("name").value = p.name;
      document.getElementById("price").value = p.price;
      document.getElementById("formTitle").textContent = "Edit Product";
      document.getElementById("saveBtn").textContent = "Update Product";
      document.getElementById("cancelBtn").style.display = "block";
      window.scrollTo({top:0,behavior:"smooth"});
    };
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete " + p.name + "?")) return;
      const {error} = await db.from("products").delete().eq("id",p.id);
      if (error) return message("Delete failed: " + error.message);
      message("Product deleted.");
      await loadProducts();
    };
    actions.append(edit,del);
    card.append(img,title,price,actions);
    container.append(card);
  });
}

document.getElementById("cancelBtn").onclick = () => {
  editingId = null;
  currentImage = "";
  document.getElementById("productForm").reset();
  document.getElementById("formTitle").textContent = "Add Product";
  document.getElementById("saveBtn").textContent = "Save Product";
  document.getElementById("cancelBtn").style.display = "none";
};

document.getElementById("productForm").onsubmit = async event => {
  event.preventDefault();
  if (!db) return message("Supabase is not configured.");
  const name = document.getElementById("name").value.trim();
  const price = Number(document.getElementById("price").value);
  const file = document.getElementById("photo").files[0];
  if (!name || !Number.isFinite(price) || price < 0)
    return message("Enter a valid product name and price.");
  if (file && (!file.type.startsWith("image/") || file.size > 5*1024*1024))
    return message("Choose an image smaller than 5 MB.");

  const saveButton = document.getElementById("saveBtn");
  saveButton.disabled = true;
  try {
    let image_url = currentImage;
    if (file) {
      const path = crypto.randomUUID() + "-" +
        file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const {error:uploadError} = await db.storage
        .from("product-images").upload(path,file,{upsert:false});
      if (uploadError) throw uploadError;
      const {data} = db.storage.from("product-images").getPublicUrl(path);
      image_url = data.publicUrl;
    }
    if (!image_url) throw new Error("Please select a product photo.");

    const record = {name,price,image_url};
    const result = editingId
      ? await db.from("products").update(record).eq("id",editingId)
      : await db.from("products").insert(record);

    if (result.error) throw result.error;
    message(editingId ? "Product updated." : "Product added.");
    document.getElementById("cancelBtn").click();
    await loadProducts();
  } catch (err) {
    message("Could not save product: " + err.message);
  } finally {
    saveButton.disabled = false;
  }
};

if (db) checkAdmin();
</script>
</body>
  </html>
